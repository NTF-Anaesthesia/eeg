# Repo checks, Worker tests and the BIS to DSA simulator tests (eeg/), on every PR and push to main.
# Each browser suite runs as its own job, side by side; "browser" is green only when all of them passed.
name: Checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repo checks and Worker tests
        run: node tools/check.mjs
      - name: BIS engine tuning
        run: node eeg/test/engine.check.mjs

  browser-suite:
    runs-on: ubuntu-24.04  # Playwright 1.56 has no chromium build for ubuntu 26.04 (ubuntu-latest from Nov 2026)
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Processed EEG (phone), cmd: "BIS_VIEW=phone node eeg/test/demo.e2e.mjs" }
          - { name: Processed EEG (desktop), cmd: "BIS_VIEW=desktop node eeg/test/demo.e2e.mjs" }
          - { name: EEG monitor sizing, cmd: "node eeg/test/layout.e2e.mjs" }
          - { name: EEG teaching, cmd: "node eeg/test/teaching.e2e.mjs" }
          - { name: EEG controls, cmd: "node eeg/test/controls.e2e.mjs" }
          - { name: EEG workshop (blinded), cmd: "node eeg/test/workshop-blind.e2e.mjs" }
          - { name: EEG workshop (TCI pump), cmd: "node eeg/test/workshop-pump.e2e.mjs" }
          - { name: EEG workshop (cases), cmd: "node eeg/test/workshop-cases.e2e.mjs" }
          - { name: EEG workshop (quiz), cmd: "node eeg/test/workshop-quiz.e2e.mjs" }
          - { name: EEG workshop (real-time EEG), cmd: "node eeg/test/workshop-realtime.e2e.mjs" }
          - { name: EEG workshop page (/workshop/), cmd: "node eeg/test/workshop-page.e2e.mjs" }
          - { name: EEG playback speed, cmd: "node eeg/test/speed.e2e.mjs" }
          - { name: EEG workshop speed keys, cmd: "node eeg/test/workshop-speed.e2e.mjs" }
          - { name: EEG workshop QA fixes (real clicks), cmd: "node eeg/test/workshop-qa.e2e.mjs" }
          - { name: EEG workshop on iPads (WebKit), cmd: "node eeg/test/workshop-ipad.e2e.mjs", browser: webkit }
    name: browser (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install a browser
        run: |
          npm install -g playwright@1.56.1
          if [ "${{ matrix.browser }}" = webkit ]; then playwright install --with-deps webkit; else playwright install chromium; fi
      - name: Test
        run: |
          export PLAYWRIGHT_PATH="$(npm root -g)/playwright/index.mjs"
          (python3 -m http.server 8080 >/dev/null 2>&1 &)
          sleep 1
          ${{ matrix.cmd }}

  browser:
    needs: browser-suite
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      RESULT: ${{ needs.browser-suite.result }}
    steps:
      - run: |
          echo "browser suites $RESULT"
          [ "$RESULT" = success ]
